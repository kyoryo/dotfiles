[opener]
zathura = [
  { run = 'zathura "$@"', orphan = true }
]
edit = [
  { run = 'nvim "$@"', block = true }
]

[open]
rules = [
  { mime = "application/pdf", use = "zathura" },
  { mime = "text/*", use = "edit" },

  { name = "*.go", use = "edit" },
  { name = "*.rs", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.toml", use = "edit" }
]

[mgr]
bookmarks = [
    "~/Dropbox/Werk/ojire/"
]
